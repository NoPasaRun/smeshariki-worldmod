# Smeshariki: warm soft look (colour, light, outline, wind), optional shadows, SSAO, water effects, bloom, god rays.
screen=WARMTH SATURATION CONTRAST VIGNETTE HAZE OUTLINE_STRENGTH NIGHT_VIS NIGHT_DEPTH <empty> CLOUDS CLOUD_COVERAGE CLOUD_HEIGHT RAIN_FX RAIN_GLOOM <empty> COLOR_LIGHT LAMP_GLOW TIME_TINT TONEMAP WIND WIND_STRENGTH <empty> PBR PBR_BUMP SPECULAR_STRENGTH PBR_FLIP_Y <empty> BLOOM BLOOM_STRENGTH BLOOM_RADIUS GODRAYS GODRAYS_STRENGTH <empty> SHADOWS SHADOW_STRENGTH shadowMapResolution shadowDistance <empty> SSAO SSAO_STRENGTH <empty> WATER_FX WATER_OPACITY WATER_TINT WATER_REFLECT WATER_WAVES WATER_SSR WATER_SSR_STEPS
sliders=LAMP_GLOW WARMTH SATURATION CONTRAST VIGNETTE HAZE NIGHT_VIS NIGHT_DEPTH OUTLINE_STRENGTH CLOUD_COVERAGE CLOUD_HEIGHT RAIN_GLOOM WIND_STRENGTH PBR_BUMP SPECULAR_STRENGTH BLOOM_STRENGTH BLOOM_RADIUS GODRAYS_STRENGTH SHADOW_STRENGTH shadowMapResolution shadowDistance SSAO_STRENGTH WATER_OPACITY WATER_TINT WATER_REFLECT WATER_WAVES WATER_SSR_STEPS

# passes that do nothing when their option is off are skipped
program.composite1.enabled=SSAO
program.composite2.enabled=BLOOM
program.composite3.enabled=BLOOM
program.composite4.enabled=BLOOM
program.composite5.enabled=GODRAYS

# our own clouds replace the vanilla ones
#ifdef CLOUDS
clouds=off
#endif
